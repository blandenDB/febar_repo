resources:
  schemas:
    customer_lifetime_value:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: FE Bar customer 360 and lifetime value build (synthetic data only)
    pipeline_ops:
      catalog_name: ${var.catalog}
      name: pipeline_ops
      comment: Operational tables for pipelines (event logs); not business data
    serving:
      catalog_name: ${var.catalog}
      name: serving
      comment: Owner-only serving copies, Lakebase synced tables and their sync logs; app access is enforced in Postgres

  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.customer_lifetime_value.name}
      name: raw
      comment: Raw synthetic source files landed from the four bank source systems
    ground_truth:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.customer_lifetime_value.name}
      name: ground_truth
      comment: Generator ground truth for evaluating matching and quality rules; never read by the pipeline
