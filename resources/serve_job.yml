resources:
  jobs:
    c360_feedback_sync:
      name: c360_feedback_sync
      description: Copy banker feedback from Lakebase into Unity Catalog (idempotent MERGE)
      tasks:
        - task_key: feedback_to_uc
          environment_key: serve
          spark_python_task:
            python_file: ../src/serve/feedback_to_uc.py
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]
      environments:
        - environment_key: serve
          spec:
            client: "2"
            dependencies:
              - psycopg[binary]>=3.1
              - databricks-sdk>=0.60
              - pandas
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
