            path: ../src/pipeline/01_bronze.sql
        - file:
            path: ../src/pipeline/02_silver_identities.sql
        - file:
            path: ../src/pipeline/03_silver_products.sql
        - file:
            path: ../src/pipeline/04_identity_matching.sql
        - file:
            path: ../src/pipeline/05_gold.sql
